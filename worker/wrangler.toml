name = "pdf-insight"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Lista originów oddzielonych przecinkami; `*` w miejscu portu dopuszcza dowolny port.
# Lokalnie nadpisywane w .dev.vars (np. o http://localhost:*).
ALLOWED_ORIGINS = "https://callmemichal.github.io"
# Model Gemini (darmowy tier). Flash-Lite, bo Flash z domyślnym „myśleniem” analizował 12-stronicową
# umowę testową ~120 s, a Flash-Lite ~11 s (limit: Wynik w mniej niż 30 s).
# Klucz API to sekret: `npx wrangler secret put GEMINI_API_KEY`.
GEMINI_MODEL = "gemini-3.5-flash-lite"

# Limit 5 Analiz na minutę na adres IP. Binding obsługuje tylko okna 10 s i 60 s, więc limit
# dobowy (30 Analiz) liczy Durable Object poniżej. `namespace_id` to dowolna liczba unikalna
# w obrębie konta Cloudflare.
[[ratelimits]]
name = "MINUTE_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[durable_objects.bindings]]
name = "DAILY_RATE_LIMITER"
class_name = "DailyAnalysisCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DailyAnalysisCounter"]
