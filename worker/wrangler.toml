name = "pdf-insight"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Lista originów oddzielonych przecinkami, porównywanych dokładnie.
# Lokalnie nadpisywana w .dev.vars (np. o http://localhost:5173).
ALLOWED_ORIGINS = "https://callmemichal.github.io"
# Model Gemini (darmowy tier). Flash-Lite, bo Flash z domyślnym „myśleniem” analizował 12-stronicową
# umowę testową ~120 s, a Flash-Lite ~11 s (limit: Wynik w mniej niż 30 s).
# Klucz API to sekret: `npx wrangler secret put GEMINI_API_KEY`.
GEMINI_MODEL = "gemini-3.5-flash-lite"

# Dobowy limit Analiz na adres IP (ANALYSES_PER_DAY w shared/src/limits.ts).
[[durable_objects.bindings]]
name = "DAILY_RATE_LIMITER"
class_name = "DailyAnalysisCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DailyAnalysisCounter"]
